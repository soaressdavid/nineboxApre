services:
  # ── Frontend (Static Site) ────────────────────────────────
  - type: web
    name: nineboxfrontend
    runtime: static
    buildCommand: ""
    staticPublishPath: frontend-ref
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Backend (Node.js) ─────────────────────────────────────
  - type: web
    name: nineboxbackend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_ENV
        value: production
